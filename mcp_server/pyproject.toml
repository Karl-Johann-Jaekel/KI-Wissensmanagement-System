[project]
name = "kwms-mcp-server"
version = "0.1.0"
description = "MCP server exposing the KI-Wissensmanagement knowledge base to Claude"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100

# Gleiche Regelauswahl wie das Backend. Ohne explizite Auswahl erbt dieses
# Unterprojekt die wechselnden ruff-Defaults — mit 0.16 kam darüber EXE002 dazu
# und schlug an, weil der Windows-Bind-Mount alle Dateien als ausführbar zeigt
# (die Git-Modi sind 100644).
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
