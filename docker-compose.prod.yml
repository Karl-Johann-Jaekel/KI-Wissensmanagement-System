# Produktions-Override (ADR-0009). Aufruf:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile public up -d --build
#
# Härtungen gegenüber dem Dev-Setup:
# - backend: kein --reload, keine Source-Bind-Mounts, kein Host-Port
#   (nur intern via Caddy erreichbar); data/ bleibt gemountet.
#
# ACHTUNG `!reset`: Compose führt Listen aus mehreren Dateien **zusammen**. Eine
# leere Liste entfernt deshalb nichts — `ports: []` und ein gekürzter
# volumes-Block ließen die Host-Ports und den Quellcode-Mount aus
# docker-compose.yml unangetastet. Nachgemessen mit Compose 5.1.4: ohne `!reset`
# stand in der aufgelösten Konfiguration weiterhin `published: "8000"` und
# `target: /app`. Diese Datei härtete also nicht, was sie zu härten versprach.
# - postgres: kein Host-Port (nur Compose-Netz).
# - backend vertraut dem X-Forwarded-For aus dem Compose-Netz. uvicorn wertet
#   den Header zwar von sich aus aus, aber nur von 127.0.0.1 — Caddy ist ein
#   eigener Container mit anderer IP, also verwarf uvicorn genau den Header,
#   den der Caddyfile eigens durchreicht. Folge: RATE_LIMIT zaehlt alle
#   Besucher als einen einzigen, ein Nutzer sperrt alle anderen aus.
#   Nachgemessen: ohne die Liste bekam ein zweiter Besucher 429, mit ihr 200.
services:
  backend:
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    ports: !reset []
    volumes: !reset
      - ./data:/app/data
      - ./demo-data:/app/demo-data:ro
      - ./scripts:/app/scripts:ro
      - ./eval:/app/eval

  postgres:
    ports: !reset []
