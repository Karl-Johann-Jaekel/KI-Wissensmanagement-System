# KI-Wissensmanagement-System — Compose
#   docker compose up                   -> postgres + backend (public core)
#   docker compose --profile local up   -> + Ollama (confidential zone, local LLM/embeddings)
#   docker compose --profile full  up   -> + frontend (dev) + n8n
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile public up -d --build
#                                       -> Produktion: Caddy (TLS + SPA + /api-Proxy), s. ADR-0009
# See PLAN §4, §7 Phase 0 + Phase 10.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kwms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kwms}
      POSTGRES_DB: ${POSTGRES_DB:-kwms}
    ports:
      # Host-side port is separate from the in-container port (always 5432) so a local
      # Postgres on 5432 doesn't block the stack. Override POSTGRES_HOST_PORT in .env.
      # Bound to loopback: reachable from this machine, invisible to the rest of the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kwms} -d ${POSTGRES_DB:-kwms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Reach the host's Ollama (confidential zone) from inside the container.
      # Override in .env to use the compose `ollama` service instead.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./demo-data:/app/demo-data:ro
      - ./scripts:/app/scripts:ro
      - ./eval:/app/eval
      - ./mcp_server:/app/mcp_server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- profile: local (confidential zone — nothing leaves the machine) ---
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    restart: unless-stopped
    ports:
      # Ollama kennt keine Authentifizierung: gehoert ausschliesslich auf Loopback.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # --- profile: grobid (Referenz-Parsing, Phase 11.4 — ADR-0019) ---
  # Bewusst das CRF-Image (0,5 GB): die Deep-Learning-Variante wiegt 14,8 GB und
  # braucht eine GPU, um schneller zu sein als die CRF-Modelle. Opt-in, weil der
  # Dienst rund 3 GB RAM belegt und der Ingest ihn nicht zwingend braucht.
  grobid:
    image: grobid/grobid:0.9.1-crf
    profiles: ["grobid"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GROBID_HOST_PORT:-8070}:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8070/api/isalive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # --- profile: full (frontend available from Phase 2, n8n from Phase 7) ---
  frontend:
    build:
      context: ./frontend
      target: dev
    profiles: ["full"]
    restart: unless-stopped
    ports:
      # Zum Testen vom Handy aus voruebergehend auf "5173:5173" zurueckstellen.
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

  # --- profile: public (Produktion: TLS + statische SPA + /api-Proxy, ADR-0009) ---
  caddy:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE: /api
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domain für automatisches TLS, z. B. wissen.example.com (":80" = lokal ohne TLS)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  ollama_data:
  n8n_data:
  caddy_data:
  caddy_config:
