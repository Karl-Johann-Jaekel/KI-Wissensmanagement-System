name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kwms
          POSTGRES_PASSWORD: kwms
          POSTGRES_DB: kwms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kwms -d kwms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: kwms
      POSTGRES_PASSWORD: kwms
      POSTGRES_DB: kwms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (loose)
        run: mypy app

      - name: Migrate DB
        run: alembic upgrade head

      - name: Pytest
        run: pytest

  frontend:
    name: frontend typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests (vitest)
        run: npm test

      - name: Typecheck + build
        run: npm run build

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
